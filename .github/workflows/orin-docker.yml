name: Build and Push ORIN Docker Images (GHCR)

# Builds ORIN (rebranded ChatbotX) Docker images with GitHub Actions' free
# 16GB-RAM runners — where the heavy Next.js build actually fits — and pushes
# them to GHCR. Render then deploys the ready-made image with zero build RAM
# required (free tier compatible).
#
# Image: ghcr.io/tanvir-hasan11/orin-builder:main

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

env:
  DOCKER_REGISTRY: ghcr.io

concurrency:
  group: orin-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-builder-image:
    name: Build orin-builder image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/builder/docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/orin-builder:main
          cache-from: type=gha,scope=orin-builder
          cache-to: type=gha,scope=orin-builder,mode=min
          platforms: linux/amd64

      - name: Output image URL
        run: |
          echo "::notice::Image published: ${DOCKER_REGISTRY}/${GITHUB_REPOSITORY_OWNER}/orin-builder:main"
